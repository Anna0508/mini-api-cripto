services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./chaves:/app/chaves
      - softhsm-dados:/var/lib/softhsm/tokens
      - ./painel:/app/painel

    environment:
      - LIMITE_CHAVES=50
      - HSM_PIN=5678


volumes:
  softhsm-dados:
